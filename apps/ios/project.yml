name: IA
options:
  bundleIdPrefix: org.fcsia
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_DEBUG_DYLIB: "NO"
    LD_QUOTE_LINKER_ARGUMENTS_FOR_COMPILER_DRIVER: "NO"
targets:
  IA:
    type: application
    platform: iOS
    sources:
      - path: IA/Sources
    info:
      path: IA/Info.plist
      properties:
        CFBundleDisplayName: IA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fcsia.ia.experiment
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ENABLE_PREVIEWS: NO
  IATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IATests
    dependencies:
      - target: IA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fcsia.ia.experiment.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IA:
    build:
      targets:
        IA: all
        IATests: [test]
    test:
      targets:
        - IATests
