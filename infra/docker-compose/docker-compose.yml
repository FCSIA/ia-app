version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ia_user
      POSTGRES_PASSWORD: ia_password
      POSTGRES_DB: ia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia_user -d ia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
