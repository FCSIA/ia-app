name: Contributor Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: contributor-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust-policy:
    name: Classify contributor trust
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.policy.outputs.trusted }}
    steps:
      - name: Apply explicit trusted-developer allowlist
        id: policy
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_DEVELOPERS: "virajdas,sreyassabbani,KirillMcQ,rebanto,daivik-debuger"
        run: |
          case ",${TRUSTED_DEVELOPERS}," in
            *",${PR_AUTHOR},"*) echo "trusted=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "trusted=false" >> "$GITHUB_OUTPUT" ;;
          esac

  validate:
    name: Lint, test, and build
    needs: trust-policy
    if: ${{ always() && (needs.trust-policy.outputs.trusted != 'true' || startsWith(github.event.pull_request.head.ref, 'release/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build-time placeholders only. The validation job never starts or contacts
      # a Convex deployment and receives no deployment credentials.
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test production audit inventory
        run: bun run audit:production:test

      - name: Generate production audit inventory
        run: bun run audit:production -- --output "$RUNNER_TEMP/ia-production-osv.json"

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.5.1
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            --output "$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_SHA256SUMS" \
            --output "$RUNNER_TEMP/osv-scanner_SHA256SUMS"
          grep 'osv-scanner_linux_amd64$' "$RUNNER_TEMP/osv-scanner_SHA256SUMS" | \
            sed "s#  osv-scanner_linux_amd64#  $RUNNER_TEMP/osv-scanner#" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Audit production dependencies
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile="osv-scanner:$RUNNER_TEMP/ia-production-osv.json" \
            --format json \
            --output-file "$RUNNER_TEMP/ia-production-osv-results.json"
          scanner_status=$?
          set -e

          # OSV-Scanner reports all severities. Only high and critical findings
          # block this gate. These two image-size advisories are the existing
          # accepted exceptions: the published package has no patched release.
          blocked_count=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select((.database_specific.severity // "") == "HIGH" or (.database_specific.severity // "") == "CRITICAL") | select(.id != "GHSA-w3rx-r6r6-pgpr" and .id != "GHSA-5p2g-fcmc-qvqq")] | length' "$RUNNER_TEMP/ia-production-osv-results.json")
          accepted_count=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select(.id == "GHSA-w3rx-r6r6-pgpr" or .id == "GHSA-5p2g-fcmc-qvqq")] | length' "$RUNNER_TEMP/ia-production-osv-results.json")
          if [ "$accepted_count" -gt 0 ]; then
            echo "Accepted existing image-size findings: $accepted_count"
          fi
          if [ "$blocked_count" -gt 0 ]; then
            cat "$RUNNER_TEMP/ia-production-osv-results.json"
            exit 1
          fi
          if [ "$scanner_status" -ne 0 ]; then
            echo "OSV-Scanner found no unaccepted high/critical production advisories; lower-severity results are non-blocking."
            jq -r '.results[]?.packages[]? | .package.name + "@" + .package.version + ": " + ((.vulnerabilities // []) | map(.id) | join(", "))' "$RUNNER_TEMP/ia-production-osv-results.json"
          fi

      - name: Verify generated brand assets
        run: bun run brand:check

      # The changelog and the in-app devlog are generated from
      # packages/devlog/data/releases.json. Catch hand edits to either output.
      - name: Verify release log
        run: bun run devlog:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  trusted-fast:
    name: Trusted contributor validation
    needs: trust-policy
    if: ${{ always() && needs.trust-policy.outputs.trusted == 'true' && !startsWith(github.event.pull_request.head.ref, 'release/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release log
        run: bun run devlog:check

      - name: Verify generated brand assets
        run: bun run brand:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [trust-policy, validate, trusted-fast]
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable validation path
        if: ${{ needs.trust-policy.result != 'success' || (needs.validate.result != 'success' && needs.trusted-fast.result != 'success') }}
        run: |
          echo "Contributor validation did not produce a successful applicable gate." >&2
          echo "trust-policy=${{ needs.trust-policy.result }} validate=${{ needs.validate.result }} trusted-fast=${{ needs.trusted-fast.result }}" >&2
          exit 1
      - name: Validation passed
        run: echo "CI Gate passed."
