name: Contributor Validation

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        description: "Exact commit to validate before production deployment"
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: contributor-validation-${{ inputs.checkout_ref && 'release' || 'event' }}-${{ inputs.checkout_ref || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ !inputs.checkout_ref }}

env:
  # Build-time placeholders only. Validation never starts or contacts a
  # Convex deployment and receives no deployment credentials.
  NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
  NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test production audit inventory
        run: bun run audit:production:test

      - name: Generate full dependency audit inventory
        run: bun run audit:production -- --all --output "$RUNNER_TEMP/ia-production-osv.json"

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.5.1
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            --output "$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_SHA256SUMS" \
            --output "$RUNNER_TEMP/osv-scanner_SHA256SUMS"
          grep 'osv-scanner_linux_amd64$' "$RUNNER_TEMP/osv-scanner_SHA256SUMS" | \
            sed "s#  osv-scanner_linux_amd64#  $RUNNER_TEMP/osv-scanner#" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Audit all dependencies
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source \
            --config=osv-scanner.toml \
            --lockfile="osv-scanner:$RUNNER_TEMP/ia-production-osv.json" \
            --format json \
            --output-file "$RUNNER_TEMP/ia-production-osv-results.json"
          scanner_status=$?
          set -e

          # OSV-Scanner uses 0 for a clean scan and 1 for findings. Any other
          # status is an execution or input error and must fail this job.
          if [ "$scanner_status" -gt 1 ]; then
            echo "OSV-Scanner failed with status $scanner_status." >&2
            [ -f "$RUNNER_TEMP/ia-production-osv-results.json" ] && cat "$RUNNER_TEMP/ia-production-osv-results.json" >&2
            exit "$scanner_status"
          fi
          if [ ! -s "$RUNNER_TEMP/ia-production-osv-results.json" ] || ! jq empty "$RUNNER_TEMP/ia-production-osv-results.json"; then
            echo "OSV-Scanner did not produce valid JSON output." >&2
            exit 1
          fi

          missing_severity=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select((.database_specific.severity // "") == "")] | length' "$RUNNER_TEMP/ia-production-osv-results.json")
          if [ "$missing_severity" -gt 0 ]; then
            echo "OSV-Scanner returned findings without database severity metadata; refusing to classify them." >&2
            cat "$RUNNER_TEMP/ia-production-osv-results.json"
            exit 1
          fi

          blocked_count=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' "$RUNNER_TEMP/ia-production-osv-results.json")
          echo "Source-patched dependency exceptions are documented in osv-scanner.toml and verified by audit:production:test."
          echo "Blocking findings at all severities: $blocked_count"
          if [ "$blocked_count" -gt 0 ] || [ "$scanner_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/ia-production-osv-results.json"
            exit 1
          fi

  metadata:
    name: Contributor metadata validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release log
        run: bun run devlog:check
      - name: Test release tooling
        run: bun run release:test
      - name: Verify generated brand assets
        run: bun run brand:check

  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore Next.js build cache
        if: matrix.task == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ runner.os }}-${{ hashFiles('.node-version', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-v1-${{ runner.os }}-${{ hashFiles('.node-version', 'bun.lock') }}-
      - name: Run check
        run: bun run ${{ matrix.task == 'test' && 'test:ci' || matrix.task }}
      - name: Save Next.js build cache
        if: matrix.task == 'build' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ runner.os }}-${{ hashFiles('.node-version', 'bun.lock') }}-${{ github.sha }}

  convex-tests:
    name: Convex tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Convex tests
        run: bun run --cwd apps/convex vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/2

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [security-audit, metadata, checks, convex-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable validation path
        if: ${{ needs.security-audit.result != 'success' || needs.metadata.result != 'success' || needs.checks.result != 'success' || needs.convex-tests.result != 'success' }}
        run: |
          echo "Contributor validation did not produce a successful applicable gate." >&2
          echo "security-audit=${{ needs.security-audit.result }} metadata=${{ needs.metadata.result }} checks=${{ needs.checks.result }} convex-tests=${{ needs.convex-tests.result }}" >&2
          exit 1
      - name: Validation passed
        run: echo "CI Gate passed."
