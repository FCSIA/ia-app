# Build the fcsia binaries for a release tag.
#
# Called by Publish Release Tag because tags made with GITHUB_TOKEN do not
# start workflows. A manually pushed tag also runs this. npm publishing is off
# until the repository variable CLI_NPM_PUBLISH is true and each package has a
# Trusted Publisher configured on npmjs.com.
name: Release CLI

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag"
        type: string
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: fcsia-darwin-arm64
            target: bun-darwin-arm64
          - asset: fcsia-darwin-x64
            target: bun-darwin-x64
          - asset: fcsia-linux-x64
            target: bun-linux-x64
          - asset: fcsia-linux-arm64
            target: bun-linux-arm64
          - asset: fcsia-windows-x64.exe
            target: bun-windows-x64
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          define="__FCSIA_CLI_VERSION__=\"${version}\""
          mkdir -p dist/cli
          bun build apps/cli/src/main.ts \
            --compile \
            --minify \
            --target "${{ matrix.target }}" \
            --define "$define" \
            --outfile "dist/cli/${{ matrix.asset }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.asset }}
          path: dist/cli/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/cli
          merge-multiple: true

      - name: Checksums
        working-directory: dist/cli
        run: sha256sum fcsia-* > SHA256SUMS

      - name: Publish assets
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes=$(printf 'IA App release %s.\n\nInstall the command-line client:\n    curl -fsSL https://app.fcsia.com/install.sh | sh\n\nBinaries for macOS, Linux, and Windows are attached with SHA256SUMS.' "$RELEASE_TAG")
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "IA App $RELEASE_TAG" \
              --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" dist/cli/* --clobber

  npm:
    name: Publish npm packages
    needs: build
    if: vars.CLI_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/cli
          merge-multiple: true

      - name: Package
        run: node scripts/package-cli-npm.mjs --binaries dist/cli --out dist/npm --version "${RELEASE_TAG#v}"

      - name: Publish
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          while IFS= read -r directory; do
            name=$(cd "dist/npm/$directory" && node -p "require('./package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              (cd "dist/npm/$directory" && npm publish --access public --provenance --tag latest)
            fi
          done < dist/npm/publish-order.txt
