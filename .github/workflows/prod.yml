# Deploy an approved, immutable release tag to production.
#
# Release data is generated and approved in a normal pull request before a
# maintainer tags its merged main commit. This workflow is deliberately
# read-only: it deploys that exact tagged commit and never writes to main.
#
# Required repo secret:
#   CONVEX_DEPLOY_KEY — production deploy key with the `deployment:deploy` permission
#   VERCEL_TOKEN — create at https://vercel.com/account/tokens
#
# Required repo variables (set via Settings → Secrets and variables → Actions):
#   VERCEL_ORG_ID      team_GHUf4kXop7vin9pdXDbiK5wq
#   VERCEL_PROJECT_ID  prj_uoyozTzyLHPCOZbDNxEbMM9oWyni
#
name: Production Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag on an approved main commit"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Fetch the submitted tag only. Validation below proves that its
          # commit is already in main before code or deployment secrets run.
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate approved release tag
        id: release
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH (received: $RELEASE_TAG)." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          release_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit already merged into main." >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          RELEASE_VERSION="$release_version" node -e '
            const { releases } = JSON.parse(require("node:fs").readFileSync("packages/devlog/data/releases.json", "utf8"));
            if (releases[0]?.version !== process.env.RELEASE_VERSION) {
              throw new Error(`Latest approved devlog version is v${releases[0]?.version ?? "none"}, not v${process.env.RELEASE_VERSION}.`);
            }
          '

          echo "sha=${release_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Contributor Validation only runs on pull requests, so a commit pushed
      # straight to main can reach production untested — that is how the
      # 2026-08-12 login outage shipped. Gate the deploy on the same suite.
      - name: Test
        run: pnpm test

      - name: Deploy Convex
        run: pnpm --filter cvx exec convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy to Vercel
        # `--archive=tgz` uploads a tarball, so Vercel's git metadata is absent.
        # Pass the build stamp explicitly instead.
        run: |
          pnpm exec vercel deploy --prod --yes --archive=tgz \
            --build-env NEXT_PUBLIC_APP_COMMIT="${{ steps.release.outputs.sha }}" \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
