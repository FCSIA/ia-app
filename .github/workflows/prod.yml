# Deploy an immutable release tag after validating its exact commit.
# Release commits pushed to main publish tags and call this workflow directly.
# Every entry point runs the full CI suite before using deployment credentials.
#
# Required repo secrets:
#   CONVEX_DEPLOY_KEY — production deploy key with the `deployment:deploy` permission
#   VERCEL_TOKEN — create at https://vercel.com/account/tokens
#
# Required repo variables (set via Settings → Secrets and variables → Actions):
#   VERCEL_ORG_ID      team_GHUf4kXop7vin9pdXDbiK5wq
#   VERCEL_PROJECT_ID  prj_uoyozTzyLHPCOZbDNxEbMM9oWyni
#
name: Production Deploy

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag on a main commit"
        type: string
        required: true
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH tag on a main commit"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.full_sha }}
      short_sha: ${{ steps.release.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          release_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$release_sha" ]]; then
            echo "Checkout does not match the release tag." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$release_sha" origin/main
          RELEASE_VERSION="${RELEASE_TAG#v}" node -e '
            const { releases } = JSON.parse(require("node:fs").readFileSync("packages/devlog/data/releases.json", "utf8"));
            if (releases[0]?.version !== process.env.RELEASE_VERSION) {
              throw new Error("Release tag does not match the latest devlog version.");
            }
          '
          echo "full_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "sha=${release_sha:0:7}" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/contributor-validation.yml
    with:
      checkout_ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex
        run: bun run --filter cvx deploy -- --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy to Vercel
        # `--archive=tgz` uploads a tarball, so Vercel's git metadata is absent.
        # Pass the build stamp explicitly instead.
        run: |
          bunx vercel deploy --prod --yes --archive=tgz \
            --build-env NEXT_PUBLIC_APP_COMMIT="${{ needs.resolve.outputs.short_sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
