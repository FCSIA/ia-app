packages:
  - "apps/*"
  - "packages/*"

enablePrePostScripts: true
nodeLinker: hoisted
verifyDepsBeforeRun: false

overrides:
  react: "19.0.0"
  react-dom: "19.0.0"
  "@types/react": "19.0.8"
  "@types/react-dom": "19.0.3"

onlyBuiltDependencies:
  - bcrypt
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
