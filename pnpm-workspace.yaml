packages:
  - "apps/*"
  - "packages/*"

enablePrePostScripts: true
nodeLinker: hoisted
verifyDepsBeforeRun: false

overrides:
  react: "19.2.3"
  react-dom: "19.2.3"
  "@types/react": "19.2.7"
  "@types/react-dom": "19.2.3"

onlyBuiltDependencies:
  - bcrypt
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
