reason = "Reviewed 2026-11-10; owner @rebanto; scope enforced by scripts/dependency-security.test.mjs. Package-name reuse false positive: sandbox 4.4.0 is the Vercel Sandbox CLI (https://github.com/vercel/sandbox/tree/main/packages/sandbox), not the abandoned gf3/sandbox JavaScript isolation library in this 2020 advisory. OSV records last_known_affected_version_range <1.0.0 but has an unbounded SEMVER range. scripts/dependency-security.test.mjs checks every locked sandbox instance and the installed package provenance. OSV re-fetched 2026-11-10 still has this unbounded range. Recheck the database correction before expiry."

