reason = "Reviewed 2026-11-10; owner @rebanto; scope enforced by scripts/dependency-security.test.mjs. glob 10.5.0 and 13.0.6 are source-patched in both CJS and ESM builds so all four aborted walker branches immediately return cb(). Regressions exercise each cancellation branch and ordinary async/sync/stream traversal. Registry latest 14.0.4 is fixed, but Expo 57 and Vercel nft still require ^13 and Next ESLint requires 10.3.10. Fixed glob 14 changes its minimatch/path-scurry dependency generations; preserve existing callers pending a reviewed migration. glob 7.2.3 precedes the affected v9+ walker. Remove these version-only exceptions with a validated fixed-major upgrade."

