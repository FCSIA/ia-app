id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-24
reason = "Reviewed 2026-11-10; owner @rebanto; scope enforced by scripts/dependency-security.test.mjs. minimatch 9.0.9 and 10.2.6 carry the upstream 77a0f5c preprocessing bounds in both CJS and ESM builds; regressions verify bounded amplification, skipped quadratic deduplication and ordinary matches. Registry latest 11.0.7 is fixed; callers still require minimatch 9/10 (glob, Expo fingerprint, TypeScript ESLint, ts-morph and Vercel Python analysis). Fixed upstream 11 changes the matcher engine, so preserve old caller APIs until their migration is reviewed. Legacy 3.1.5 lacks the implicated firstPhasePreProcess/optimizationLevel algorithm, which the regression verifies. This is a version-scoped patch/non-applicability exception, not a package-wide fix."

