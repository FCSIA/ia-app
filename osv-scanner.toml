id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-24
reason = "Reviewed 2026-11-10; owner @rebanto; scope enforced by scripts/dependency-security.test.mjs. Application Zod 4 instances are fixed at 4.6.7. Remaining 3.22.4 and 3.25.76 instances belong to CLI tooling with no compatible patched Zod 3 release as of this review. New shadcn 4.23.0 and registry 0.2.1 use Zod 4, but latest Vercel backends/express/hono 25.0.0 and python-analysis 0.15.3 still pin 3.22.4; locked Expo CLI 57.0.27, shadcn 4.21.1, @shadcn/registry 0.1.0 and Vercel adapters still require Zod 3. This is a time-limited tooling risk exception, not a blanket false-positive claim: 3.25.76 also bundles old v4 code, and size-bounded Zod 3 arrays still visit every element. Do not validate untrusted bulk data with those tooling instances; migrate their callers before removing this exception."

