reason = "Zod 4.6.5 uncontrolled resource consumption in $ZodArray (CVE-2023-54404). Application dependencies upgraded to zod 4.6.7. OSV advisory records unbounded lower SEMVER range (< 4.6.6) which false-positives on Zod 3.x instances used by Expo CLI and Vercel tooling. Recheck upstream advisory scoping before expiry."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-11-01
reason = "deepmerge 4.3.1 has no fixed upstream release. patches/deepmerge@4.3.1.patch rejects __proto__ keys in both target-copy and source-merge paths in source, CommonJS and UMD entry points. scripts/dependency-security.test.mjs reproduces the null-prototype, null-placeholder and poisoned-target attacks and checks ordinary merges. This exception covers the patched version identifier only; remove when a fixed release is adopted."

