reason = "Reviewed 2026-11-10; owner @rebanto; scope enforced by scripts/dependency-security.test.mjs. Registry latest deepmerge remains 4.3.1 on 2026-11-10; there is no fixed upstream release. patches/deepmerge@4.3.1.patch rejects __proto__ keys in both target-copy and source-merge paths in source, CommonJS and UMD entry points. scripts/dependency-security.test.mjs reproduces the null-prototype, null-placeholder and poisoned-target attacks and checks ordinary merges. This exception covers the patched version identifier only; remove when a fixed release is adopted."

