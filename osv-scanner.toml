id = "GHSA-44jh-23m7-hpcf"
ignoreUntil = 2027-01-24
reason = "Reviewed 2026-11-10; owner @rebanto; scope enforced by scripts/dependency-security.test.mjs. Configuration-specific non-applicability: this app uses the Convex adapter, never the PostgreSQL Drizzle/Kysely adapters implicated by the rate-limit race. scripts/dependency-security.test.mjs enforces the exact createAuthOptions configuration and locked better-auth/adapter 1.6.22 versions. Installed Convex integration 0.12.2 supports <1.7.0. Integration 0.13.0 now supports >=1.7.16 <1.8.0, but requires local adapter/schema migration and disables session.cookieCache; the app uses a custom local schema/adapter and enabled cookie cache. Retain until that migration is validated, not because upstream support is absent; reassess on integration upgrade or any auth configuration change. This does not mark upstream code patched."

