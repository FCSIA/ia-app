<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scan to Test App on iPhone</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem 3rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; color: #111; }
    p  { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    img { border-radius: 8px; border: 4px solid white; }
    .url { margin-top: 1rem; font-size: 1rem; font-weight: 600; color: #f97316; }
    .note { margin-top: 0.5rem; font-size: 0.78rem; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 Test on iPhone</h1>
    <p>Make sure your iPhone is on the same WiFi, then scan:</p>
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=http://10.0.0.126:3000"
      width="280"
      height="280"
      alt="QR Code for http://10.0.0.126:3000"
    />
    <div class="url">http://10.0.0.126:3000</div>
    <div class="note">Open Camera app → point at code → tap the link</div>
  </div>
</body>
</html>
